{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'home/favicon.png' %}">
    <title>Contact Us - VibeWear</title>
    <link rel="stylesheet" href="{% static 'home/style.css' %}">
    <link rel="stylesheet" href="{% static 'home/shop.css' %}">
</head>
<body>
    {% include 'home/_nav.html' %}
    {% include 'home/_messages.html' %}

    <section id="contact">
        <h2>Contact Us</h2>
        <form method="POST" action="{% url 'contact' %}">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="form-group">
                {{ form.name }}
                {{ form.name.errors }}
            </div>
            <div class="form-group">
                {{ form.email }}
                {{ form.email.errors }}
            </div>
            <div class="form-group">
                {{ form.message }}
                {{ form.message.errors }}
            </div>
            <button type="submit" class="submit-button">Send Message</button>
        </form>
    </section>
</body>
</html>
