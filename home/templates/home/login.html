{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'home/favicon.png' %}">
    <title>Login - VibeWear</title>
    <link rel="stylesheet" href="{% static 'home/style1.css' %}">
    <style>
        body { height: auto; min-height: 100vh; box-sizing: border-box; padding: 24px 12px; }
        .errorlist { color: #b31414; font-size: 12px; list-style: none; margin: 0 0 6px; padding: 0; text-align: left; }
    </style>
</head>
<body>
    <h1>Login</h1>
    <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% if form.non_field_errors %}
            <p style="color:#ffb3b3;">{{ form.non_field_errors.0 }}</p>
        {% endif %}
        {{ form.username }}
        {{ form.username.errors }}
        {{ form.password }}
        {{ form.password.errors }}
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'signup' %}">Signup here</a>.</p>
    <p><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
</body>
</html>
