{% load static %}
<nav>
    <div class="logo">
        <a href="{% url 'home' %}"><img src="{% static 'home/good-vibes.png' %}" alt="VibeWear Logo" style="width: 30px; height: 30px;"></a>
        <span>VibeWear</span>
    </div>
    <ul>
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'shop' %}">Shop</a></li>
        <li><a href="{% url 'about' %}">About</a></li>
        <li><a href="{% url 'contact' %}">Contact</a></li>
        {% if user.is_authenticated %}
            <li><a href="{% url 'wishlist' %}">Wishlist{% if wishlist_count %}<span class="vw-cart-badge">{{ wishlist_count }}</span>{% endif %}</a></li>
            <li><a href="{% url 'dashboard' %}">Hi, {{ user.username }}</a></li>
        {% else %}
            <li><a href="{% url 'login' %}">Login</a></li>
            <li><a href="{% url 'signup' %}">Signup</a></li>
        {% endif %}
        <li class="vw-cart-item">
            <a href="{% url 'cart' %}" class="vw-cart-link" aria-label="Cart, {{ cart_count }} item{{ cart_count|pluralize }}" title="Cart">
                <svg class="vw-cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="vw-cart-badge">{{ cart_count }}</span>
            </a>
        </li>
    </ul>
</nav>
