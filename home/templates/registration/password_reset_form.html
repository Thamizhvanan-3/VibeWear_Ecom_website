{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - VibeWear</title>
    <link rel="stylesheet" href="{% static 'home/style1.css' %}">
    <style>
        body { height: auto; min-height: 100vh; box-sizing: border-box; padding: 24px 12px; }
        p { max-width: 380px; text-align: center; }
        .errorlist { color: #b31414; font-size: 12px; list-style: none; margin: 0 0 6px; padding: 0; text-align: left; }
    </style>
</head>
<body>
    <h1>Reset password</h1>
    <p>Enter the email address linked to your VibeWear account and we will send you a reset link.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.email }}
        {{ form.email.errors }}
        <button type="submit">Send reset link</button>
    </form>
    <p><a href="{% url 'login' %}">Back to login</a></p>
</body>
</html>
